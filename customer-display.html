<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shamrock Market - Customer Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: white;
      overflow: hidden;
      height: 100vh;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    .cart-section {
      width: 45%;
      background: linear-gradient(180deg, #16213e 0%, #1a1a2e 100%);
      display: flex;
      flex-direction: column;
      border-right: 3px solid #0f3460;
    }

    .store-header {
      background: linear-gradient(135deg, #00a896 0%, #028090 100%);
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .store-logo {
      width: 60px;
      height: 60px;
      background: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .store-info h1 {
      font-size: 1.75rem;
      font-weight: 700;
    }

    .store-info p {
      font-size: 0.875rem;
      opacity: 0.9;
    }

    .cart-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      padding: 1rem 1.5rem;
      background: #1a1a2e;
      font-size: 0.875rem;
      font-weight: 600;
      color: #8b8fa3;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #2a3550;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }

    .cart-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #2a3550;
      font-size: 1.125rem;
    }

    .cart-row:last-child {
      border-bottom: none;
    }

    .item-name {
      font-weight: 500;
    }

    .item-qty {
      text-align: center;
      color: #a0a5b8;
    }

    .item-price {
      text-align: right;
      font-weight: 600;
      color: #00d9a5;
    }

    .empty-cart {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #5a6280;
    }

    .empty-cart svg {
      width: 80px;
      height: 80px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-cart p {
      font-size: 1.25rem;
    }

    .totals-section {
      background: #16213e;
      padding: 1.5rem 2rem;
      border-top: 2px solid #0f3460;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      font-size: 1.125rem;
      color: #a0a5b8;
    }

    .total-row.grand {
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
      padding: 1rem 0;
      border-top: 2px solid #2a3550;
      margin-top: 0.75rem;
    }

    .total-row.grand .amount {
      color: #00d9a5;
    }

    .marketing-section {
      width: 55%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .marketing-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.5s ease-in-out;
    }

    .marketing-placeholder {
      text-align: center;
      color: #5a6280;
    }

    .marketing-placeholder svg {
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
      opacity: 0.3;
    }

    .marketing-placeholder h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #8b8fa3;
    }

    .marketing-placeholder p {
      font-size: 1rem;
    }

    .welcome-message {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 168, 150, 0.9);
      padding: 1rem 2rem;
      border-radius: 12px;
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cart-section">
      <div class="store-header">
        <div class="store-logo">&#9752;</div>
        <div class="store-info">
          <h1>Shamrock Market</h1>
          <p>Your Neighborhood Store</p>
        </div>
      </div>

      <div class="cart-header">
        <span>Item</span>
        <span style="text-align: center;">Qty</span>
        <span style="text-align: right;">Price</span>
      </div>

      <div class="cart-items" id="cartItems">
        <div class="empty-cart" id="emptyCart">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <p>Ready to scan items</p>
        </div>
      </div>

      <div class="totals-section">
        <div class="total-row">
          <span>Subtotal</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="total-row">
          <span>Tax</span>
          <span id="tax">$0.00</span>
        </div>
        <div class="total-row grand">
          <span>TOTAL</span>
          <span class="amount" id="total">$0.00</span>
        </div>
      </div>
    </div>

    <div class="marketing-section" id="marketingSection">
      <div class="marketing-placeholder" id="marketingPlaceholder">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <h2>Marketing Display</h2>
        <p>Add images to marketing-images folder</p>
      </div>
      <img class="marketing-image" id="marketingImage" style="display: none;" alt="Marketing">
      <div class="welcome-message" id="welcomeMessage">Welcome to Shamrock Market!</div>
    </div>
  </div>

  <script>
    let marketingImages = [];
    let currentImageIndex = 0;
    let imageRotationInterval = null;

    function formatPrice(price) {
      return '$' + (price || 0).toFixed(2);
    }

    const emptyCartHTML = `
      <div class="empty-cart">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <p>Ready to scan items</p>
      </div>
    `;
    
    function updateCart(cartData) {
      const cartItems = document.getElementById('cartItems');
      const subtotalEl = document.getElementById('subtotal');
      const taxEl = document.getElementById('tax');
      const totalEl = document.getElementById('total');

      if (!cartData || !cartData.items || cartData.items.length === 0) {
        cartItems.innerHTML = emptyCartHTML;
        subtotalEl.textContent = '$0.00';
        taxEl.textContent = '$0.00';
        totalEl.textContent = '$0.00';
        return;
      }

      let html = '';
      cartData.items.forEach(item => {
        const lineTotal = (item.price || 0) * (item.qty || 1);
        html += `
          <div class="cart-row">
            <span class="item-name">${item.name || 'Unknown'}</span>
            <span class="item-qty">${item.qty || 1}</span>
            <span class="item-price">${formatPrice(lineTotal)}</span>
          </div>
        `;
      });

      cartItems.innerHTML = html;
      subtotalEl.textContent = formatPrice(cartData.subtotal || 0);
      taxEl.textContent = formatPrice(cartData.tax || 0);
      totalEl.textContent = formatPrice(cartData.total || 0);
    }

    function showNextImage() {
      if (marketingImages.length === 0) return;

      const imgEl = document.getElementById('marketingImage');
      const placeholder = document.getElementById('marketingPlaceholder');

      currentImageIndex = (currentImageIndex + 1) % marketingImages.length;
      imgEl.style.opacity = '0';

      setTimeout(() => {
        imgEl.src = marketingImages[currentImageIndex];
        imgEl.style.opacity = '1';
      }, 300);

      placeholder.style.display = 'none';
      imgEl.style.display = 'block';
    }

    function startImageRotation(images) {
      if (!images || images.length === 0) {
        document.getElementById('marketingPlaceholder').style.display = 'flex';
        document.getElementById('marketingImage').style.display = 'none';
        return;
      }

      marketingImages = images;
      currentImageIndex = -1;

      if (imageRotationInterval) {
        clearInterval(imageRotationInterval);
      }

      showNextImage();
      imageRotationInterval = setInterval(showNextImage, 5000);
    }

    function initCustomerDisplay() {
      if (window.electronAPI) {
        if (window.electronAPI.onCartUpdate) {
          window.electronAPI.onCartUpdate((data) => {
            console.log('Customer display received cart update:', data);
            updateCart(data);
          });
        }

        if (window.electronAPI.onMarketingImages) {
          window.electronAPI.onMarketingImages((images) => {
            console.log('Customer display received marketing images:', images);
            startImageRotation(images);
          });
        }
      } else {
        console.log('electronAPI not available, retrying...');
        setTimeout(initCustomerDisplay, 500);
      }
    }
    
    document.addEventListener('DOMContentLoaded', initCustomerDisplay);

    setTimeout(() => {
      const welcomeMsg = document.getElementById('welcomeMessage');
      if (welcomeMsg) welcomeMsg.style.display = 'none';
    }, 5000);
  </script>
</body>
</html>
